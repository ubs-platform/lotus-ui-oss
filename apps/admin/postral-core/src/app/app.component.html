<!-- İnce ayar diyaloğu için overlay panel kullanılıyor -->
<ng-template #steeringConfig>
  <div>
    <toggle label="postral.view.precision.4" [value]="moneyPrecision() === 4"
      (valueChange)="setMoneyPrecision($event ? 4 : 2)"></toggle>
  </div>

<!-- <lib-webdialog [show]="true"></lib-webdialog> -->
<lotus-web-toast-host></lotus-web-toast-host>

<div style="height: 100dvh; width: 100dvw">
  <router-outlet></router-outlet>
</div>

<ng-template #header>
  <lotus-web-generic-app-header [customMenus]="menus()" logoutRedirectUrl="/login">
    <!-- Aynı menüler sağ üst menüde de var zaten. Mobilde bunu açıp girebilirler -->
    <div header-left class="hidden lg:flex gap-2 items-center">
      <block-button buttonClass="surface" stringContent="postral.menu.account-management"
        routerLink="/user/payment-accounts/account"></block-button>
      <block-button buttonClass="surface" stringContent="postral.menu.sale-simulation"
        routerLink="/sale-simulation"></block-button>
    </div>
    <div header-right>
      <lib-overlay-panel #overlayPanel>
        <div *ngTemplateOutlet="steeringConfig"></div>

      </lib-overlay-panel>

      <block-button (click)="overlayPanel.toggleDialog($event,'DOWN')" iconContent="settings" [hasContent]="false" iconClass="material-symbols-outlined" [lib-tooltip]="'İnce ayarlar'"></block-button>
    </div>
    <ng-template appLogo>
      <div class="px-3 pt-2">
        <div class="app-logo" role="img" aria-label="Postral Logo"></div>
        <div class="p-0 w-full text-right" style="font-size: 12px">
          Core Beta
        </div>
      </div>
    </ng-template>
    <ng-template appFooter>
      <h3>Postral Core</h3>
      <p>© 2026 Tetakent (H.C.G).</p>
      <p>{{ 'general.all-rights-reserved' | translate }}</p>
      <div class="app-logo-with-tetakent" role="img" aria-label="Postral from Tetakent developments"></div>
    </ng-template>
  </lotus-web-generic-app-header>
</ng-template>
