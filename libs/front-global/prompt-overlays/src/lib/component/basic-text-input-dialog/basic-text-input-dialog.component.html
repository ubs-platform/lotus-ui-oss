<div>
  <input *ngIf="!longTextMode" pInputText [(ngModel)]="value" />
  <!-- <input pInputText [(ngModel)]="value" /> -->
  <textarea
    *ngIf="longTextMode"
    rows="5"
    cols="30"
    pInputTextarea
    [(ngModel)]="value"
  ></textarea>
</div>
<div class="flex gap-1 py-2">
  <block-button
    buttonClass="primary"
    iconClass="material-symbols-outlined" iconContent="check"
    (click)="close(value)"
    stringContent="general.ok"
    ></block-button
  >
  <block-button buttonClass="border" (click)="close()" stringContent="general.cancel"></block-button>
</div>
