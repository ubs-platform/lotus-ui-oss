<h2>{{ dialogConfig.data?.header | translate }}</h2>

<div class="p-2">
  <minky-reform-prime [reform]="dialogConfig.data?.reform"></minky-reform-prime>
  <div class="action-buttons">
    <block-button
      (click)="complete()"
      buttonClass="primary"
      iconClass="material-symbols-outlined" iconContent="check"
      stringContent="general.ok"
      ></block-button
    >
    <block-button (click)="cancel()" iconClass="material-symbols-outlined" iconContent="close" stringContent="general.cancel"></block-button
    >
  </div>
</div>
