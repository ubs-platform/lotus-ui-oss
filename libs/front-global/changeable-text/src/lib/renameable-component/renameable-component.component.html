<div class="flex">
  <input
    [(ngModel)]="intervalValue"
    (focus)="focused = true"
    />
  @if (focused) {
    <div class="flex">
      <block-button [cover]="false" (click)="changeValue()"
        >Değiştir</block-button
        >
        <block-button
          [cover]="false"
          iconClass="material-symbols-outlined" iconContent="close"
          (click)="intervalValue = value() || ''"
          >İptal</block-button
          >
        </div>
      }
    </div>
