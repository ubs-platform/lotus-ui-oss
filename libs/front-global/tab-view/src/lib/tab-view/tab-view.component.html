<div class="w-full flex flex-column" [class.h-full]="!onlyButtons()">
  <div class="flex" style="border-bottom:1px solid var(--border-color)">
    @for (item of blockPages(); track $index) {
    <block-button
      [iconClass]="item.iconClass()"
      [iconContent]="item.iconContent()"
      [iconImageSource]="item.iconImageSource()"
      
      [buttonClass]="[selectedTabName() === item.name() ? 'primary' : '', 'sharp']"
      (click)="onTabHeaderClick(item.name())"
    >
      {{ item.title() | translate}}</block-button
    >
    }
  </div>
  @if (!onlyButtons()) {
  <div class="flex-grow-1 overflow-hidden">
    <ubs-touch-tab
      [initialPage]="initialTab()"
      (pageSelected)="onPageSelected($event)"
      #touchTabView
    >
      @for (item of blockPages(); track $index) {
      <ng-template [block-page]="item.name()">
        <div class="h-full w-full overflow-auto">
          <ng-container *ngTemplateOutlet="item.template"></ng-container>
        </div>
      </ng-template>
      }
    </ubs-touch-tab>
  </div>
  }
</div>
