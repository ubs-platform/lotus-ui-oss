@if (isDesktop() || !hideOnMobile()) {
<div class="flex align-items-end gap-1">
  @if (backAction()) {
  <block-button
    [iconClass]="backAction()!.iconClass"
    [iconContent]="backAction()!.iconContent"
    (click)="backAction()?.action()"
    [stringContent]="backAction()?.stringContent"
    buttonClass="mb-1"
  ></block-button>
  }
  <div>
    @if (topMinimal()) {
    <div>
      <sub> {{ topMinimal() | translate }} </sub>
    </div>
    }
    <h1>{{ content() | translate }}</h1>
  </div>
</div>
}
