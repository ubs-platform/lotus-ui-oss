<h3>Hesap oluşturma</h3>
<p>Lütfen bilgilerinizi girin.</p>
<minky-reform-prime [reform]="reform">
  <ng-template title-link let-title="title">
    {{ title | translate }}
  </ng-template>
</minky-reform-prime>
@if (reform) {
  <div class="action-buttons">
    <block-button
      buttonClass="primary"
      iconClass="material-symbols-outlined" iconContent="chevron_right"
      iconPosition="RIGHT"
      (click)="sendRequest()"
      stringContent="general.next"
      ></block-button
      >
    </div>
  }
