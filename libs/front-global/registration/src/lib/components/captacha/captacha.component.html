  <img class="app-logo" src="assets/tkent.png" />
  <h1 class="text-align-center">Tetakent hesabınızı oluşturun</h1>
  <div class="mb-4">
    <p>
      Lotus ve heyecan verici yeni gelecek uygulamalarımızı bu hesap üzerinden
      kullanabilecesiniz. Başlamadan önce kullanım şartlarını kabul etmeniz ve
      robot olmadığınızı teyit etmeniz gerekmektedir.
    </p>

    <div class="mb-1 flex flex-column align-items-center justify-content-center">
      <toggle
        [checkboxStyle]="true"
        [value]="agreed"
        [checkOnClickInput]="false"
        [checkOnClickText]="false"
        (click)="!agreed ? showEULAUpAndEnable() : (agreed = !agreed)"
        label="Kullanım şartlarını okudum ve kabul ediyorum"
      >
      </toggle>
      <toggle
        [checkboxStyle]="true"
        [value]="privacyAccepted"
        [checkOnClickInput]="false"
        [checkOnClickText]="false"
        (click)="
          !privacyAccepted
            ? showPrivacyUpAndEnable()
            : (privacyAccepted = !privacyAccepted)
        "
        label="Gizlilik politikasını okudum ve kabul ediyorum"
      >
      </toggle>
    </div>


    <div class="m-3">

    </div>
    <div class="action-buttons">
      <block-button
        [cover]="true"
        iconClass="material-symbols-outlined"
        iconContent="chevron_right"
        iconPosition="RIGHT"
        [disabled]="!(agreed && notBot)"
        (click)="nextStep(null)"
        buttonClass="primary"
        stringContent="general.next"
      ></block-button>
    </div>
  </div>
</div>
