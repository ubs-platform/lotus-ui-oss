  <img class="app-logo" src="assets/tkent.png" />
  <h1 class="text-align-center">Tetakent hesabınızı oluşturun</h1>
  <div class="mb-4">
    <p>
      Lotus ve heyecan verici yeni gelecek uygulamalarımızı bu hesap üzerinden
      kullanabilecesiniz. Başlamadan önce kullanım şartlarını kabul etmeniz ve
      robot olmadığınızı teyit etmeniz gerekmektedir.
    </p>
    <div
      (click)="showEULAUpAndEnable()"
      class="mb-1 flex justify-content-center"
    >
      <div [style.pointer-events]="eulaEnabled ? null : 'none'">
        <p-checkbox
          label="Kullanım şartlarını okudum ve kabul ediyorum"
          [ngModel]="agreed"
          [binary]="true"
          (ngModelChange)="agreed = $event"
        ></p-checkbox>
      </div>
    </div>
    <br />
    <div
      (click)="showPrivacyUpAndEnable()"
      class="mb-1 flex justify-content-center"
    >
      <div [style.pointer-events]="privacyEnabled ? null : 'none'">
        <p-checkbox
          label="Gizlilik politikasını okudum ve kabul ediyorum"
          [ngModel]="privacyAccepted"
          [binary]="true"
          (ngModelChange)="privacyAccepted = $event"
        ></p-checkbox>
      </div>
    </div>

    <div class="m-3">
      <!-- <p-captcha

    > -->
    </div>
    <div class="action-buttons">
      <block-button
        iconClass="material-symbols-outlined" iconContent="chevron_right"
        [disabled]="!(agreed && notBot)"
        (click)="nextStep(null)"
        buttonClass="primary"
        >İleri</block-button
      >
    </div>
  </div>
</div>
