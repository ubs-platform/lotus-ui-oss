@if (carrier()) {
<div>
  <block-button (click)="sourceEditor.set(!sourceEditor())" [stringContent]="!sourceEditor() ? 'Kaynak Kodu düzenle' : 'Görsel HTML Editör'">
  </block-button>
  @if (!sourceEditor()) {
  <div>
    <div #quillEditor></div>
  </div>
  }

  @if (sourceEditor()) {
  <div>
    <ngx-monaco-editor [options]="monacoOps()" [ngModel]="carrier()!.value"
      (ngModelChange)="carrier()!.setValue($event)"></ngx-monaco-editor>

  </div>
  }

  <div>
    @if (carrier()!.isTouched && carrier()!.validationErrors?.length) {
    <lotus-web-message styleClass="my-1 w-full" severity="error"
      [text]="carrier()!.validationErrors[0].name || '' | translate"></lotus-web-message>
    }
  </div>
</div>
}
