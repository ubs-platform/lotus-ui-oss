<div class="h-full w-full flex flex-column md:flex-row">

  <div class="flex-grow-1 overflow-auto">
    <searchable-data-table [url]="fetchUrl" [reformFilter]="reform" #table>
      <column name="type">
        <ng-template header>Tip</ng-template>
        <ng-template data let-item="item">
          {{ item.type }}
        </ng-template>
      </column>
      <column name="summary">
        <ng-template header>Özet</ng-template>
        <ng-template data let-item="item">
          {{ item.summary }}
        </ng-template>
      </column>
      <column name="firstname">
        <ng-template header>İsim</ng-template>
        <ng-template data let-item="item">
          {{ item.firstName }}
          {{ item.lastName }}
        </ng-template>
      </column>

      <column name="date">
        <ng-template header>Tarih</ng-template>
        <ng-template data let-item="item">
          {{ item.creationDate | date }}
        </ng-template>
      </column>

      <column name="actions">
        <ng-template header content="general.actions"></ng-template>
        <ng-template data let-item="item">
          <block-button buttonClass="primary" iconClass="material-symbols-outlined" iconContent="visibility"
            routerLink="./{{ item._id }}" stringContent="general.details"></block-button>
          <block-button buttonClass="error" iconClass="material-symbols-outlined" iconContent="close"
            (click)="remove(item._id)" stringContent="general.delete"></block-button>
        </ng-template>
      </column>
    </searchable-data-table>
  </div>
</div>
