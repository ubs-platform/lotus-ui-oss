<div class="h-full w-full flex gap-1 flex-column">
  <div class="flex flex-row-reverse">
    <block-button buttonClass="primary" iconClass="material-symbols-outlined" iconContent="add"
      routerLink="new">Yeni</block-button>
    <block-button buttonClass="secondary" iconClass="material-symbols-outlined" iconContent="upload"
      (click)="importFromJson()" [disabled]="isImporting()" style="margin-left: 0.5rem;">
      {{ isImporting() ? 'İçe Aktarılıyor...' : 'JSON İçe Aktar' }}
    </block-button>
  </div>

  <div class="flex-grow-1 overflow-auto">
    <ubs-table-ngx [items]="templates">
      <column name="id">
        <ng-template header> Id </ng-template>
        <ng-template data let-item="item">
          {{ item._id }}
        </ng-template>
      </column>
      <column name="name">
        <ng-template header> İsim </ng-template>
        <ng-template data let-item="item">
          <div>{{ item.name }}</div>
        </ng-template>
      </column>
      <column name="htmlContent">
        <ng-template header> İçerik </ng-template>
        <ng-template data let-item="item">
          <div>{{ item.htmlContent ? 'HTML İçerik' : 'Boş' }}</div>
        </ng-template>
      </column>
      <column name="actions">
        <ng-template header content="general.actions"></ng-template>
        <ng-template data let-item="item">
          <block-button buttonClass="primary" iconClass="material-symbols-outlined" iconContent="edit"
            routerLink="{{ item._id }}" stringContent="general.edit.verb">Düzenle</block-button>
          <block-button buttonClass="bg-danger" iconClass="material-symbols-outlined" iconContent="delete"
            (click)="remove(item._id)">Kaldır</block-button>
        </ng-template>
      </column>
    </ubs-table-ngx>
  </div>
</div>
