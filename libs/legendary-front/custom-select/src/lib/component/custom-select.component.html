<ng-template let-item="item" #defaultOptionText>
  {{ item?.text | translate }}
</ng-template>

<ng-template #dropdownTemplate>
  <div class="costum-selection expanded">
    <div class="search-input" *ngIf="searchable()">
      <lib-icon
        iconClass="material-symbols-outlined"
        iconContent="search"
      ></lib-icon>
      <input
        #searchInput
        type="text"
        placeholder="{{ searchPlaceholder() | translate }}"
        [value]="searchText()"
        (input)="onSearchInput($event)"
        (keydown)="onListKeyDown($event)"
      />
    </div>
    <div class="items">
      @for (option of visibleOptions(); track trackByValue($index, option); let
      i = $index) {
      <div
        class="item"
        tabindex="-1"
        [class.error]="error()"
        [class.active]="i === activeIndex()"
        [attr.value]="option.value"
        (click)="selectVal(option)"
        (mouseenter)="setActiveIndex(i)"
        (keydown)="onListKeyDown($event)"
      >
        <ng-container
          *ngTemplateOutlet="
            optionValuesTemplate() || defaultOptionText;
            context: { $implicit: option, item: option }
          "
        >
        </ng-container>
      </div>
      }
    </div>
  </div>
</ng-template>

<div [style.minWidth]="minWidth()">
  <div class="costum-selection" [ngClass]="containerClasses()">
    <div
      #trigger
      class="head flex flex-row flex-align-center justify-content-between"
      [ngClass]="headClasses()"
      (click)="toggleOptionsShow(); handleElementClick()"
    >
      <div class="text">
        {{ displayText() | translate }}
        <ng-container
          *ngTemplateOutlet="
            optionValuesTemplate() || defaultOptionText;
            context: { $implicit: selected(), item: selected() }
          "
        >
        </ng-container>
      </div>
      <div class="flex align-items-center justify-content-center pr-1">
        <i class="material-symbols-outlined" style="height: 0; line-height: 0"
          >expand_more</i
        >
      </div>
    </div>
  </div>
</div>
