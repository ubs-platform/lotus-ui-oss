<ng-template let-item="item" #defaultOptionText>
  {{ item?.text | translate }}
</ng-template>

<div
  (mouseenter)="mouseEntered.set(true)"
  (mouseleave)="mouseEntered.set(false)"
  (window:click)="handleWindowClick()"
  [style.minWidth]="minWidth()"
>
  <div class="costum-selection" [ngClass]="containerClasses()">
    <div
      class="head flex flex-row flex-align-center justify-content-between"
      [ngClass]="headClasses()"
      (click)="toggleOptionsShow(); handleElementClick()"
    >
      <div class="text">
        {{ displayText() }}
        <ng-container
          *ngTemplateOutlet="
            optionValuesTemplate() || defaultOptionText;
            context: { $implicit: selected(), item: selected() }
          "
        >
        </ng-container>
      </div>
      <div class="flex align-items-center justify-content-center pr-1">
        <i class="pi pi-chevron-down" style="height: 0; line-height: 0;"></i>
      </div>
    </div>

    <div class="items" [ngStyle]="optionsShow() ? dropdownStyle() : null">
      @for (option of options(); track trackByValue($index, option)) { @if
      (!isSelected(option.value) || !hideSelectedItem()) {
      <div
        class="item"
        [class.error]="error()"
        [attr.value]="option.value"
        (click)="selectVal(option)"
      >
        <ng-container
          *ngTemplateOutlet="
            optionValuesTemplate() || defaultOptionText;
            context: { $implicit: option, item: option }
          "
        >
        </ng-container>
      </div>
      } }
    </div>
  </div>
</div>
