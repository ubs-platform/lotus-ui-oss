<lotus-web-data-list-layout>
  <ng-template action>
    <button class="btn btn-primary" (click)="create()">
      Yeni Kanal Ekle
    </button>
  </ng-template>
  <ng-container content>
    <searchable-data-table
      url="/service/payment/api/payment-channel-config/_search"
      [cover]="true"
      #table
    >
      <column name="channelId">
        <ng-template header>Kanal ID</ng-template>
        <ng-template data let-item="item">{{ item.channelId }}</ng-template>
      </column>
      <column name="name">
        <ng-template header>Görünen Ad</ng-template>
        <ng-template data let-item="item">{{ item.name }}</ng-template>
      </column>
      <column name="enabled">
        <ng-template header>Aktif</ng-template>
        <ng-template data let-item="item">
          <span [class]="item.enabled ? 'badge badge-success' : 'badge badge-danger'">
            {{ item.enabled ? 'Evet' : 'Hayır' }}
          </span>
        </ng-template>
      </column>
      <column name="devOnly">
        <ng-template header>Sadece Dev</ng-template>
        <ng-template data let-item="item">
          <span [class]="item.devOnly ? 'badge badge-warning' : ''">
            {{ item.devOnly ? 'Evet' : '-' }}
          </span>
        </ng-template>
      </column>
      <column name="createdAt">
        <ng-template header>Oluşturulma</ng-template>
        <ng-template data let-item="item">{{ item.createdAt | date: 'short' }}</ng-template>
      </column>
      <column name="actions">
        <ng-template header>Aksiyonlar</ng-template>
        <ng-template data let-item="item">
          <div class="action-buttons">
            <block-button
              (click)="remove(item.id)"
              buttonClass="bg-danger"
              iconClass="material-symbols-outlined"
              iconContent="delete"
              >Sil</block-button
            >
            <block-button
              (click)="edit(item)"
              buttonClass="primary"
              iconClass="material-symbols-outlined"
              iconContent="edit"
              >Düzenle</block-button
            >
          </div>
        </ng-template>
      </column>
    </searchable-data-table>
  </ng-container>
</lotus-web-data-list-layout>
