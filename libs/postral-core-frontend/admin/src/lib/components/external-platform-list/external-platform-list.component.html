<lotus-web-data-list-layout>
  <ng-template action action>
    <block-button
      buttonClass="btn btn-primary"
      (click)="goToCreate()"
    >
      Dış Platform Ekle
    </block-button>
  </ng-template>
  <ng-container content>
    <searchable-data-table
      url="/service/payment/api/external-platform/_search"
      [cover]="true"
      #table
    >
      <column name="name">
        <ng-template header> Platform adı </ng-template>
        <ng-template data let-item="item">
          {{ item.name }}
        </ng-template>
      </column>
      <column name="code">
        <ng-template header> Kod </ng-template>
        <ng-template data let-item="item">
          {{ item.code }}
        </ng-template>
      </column>

      <column name="createdAt">
        <ng-template header> Oluşturulma Tarihi </ng-template>
        <ng-template data let-item="item">
          {{ item.createdAt | date : 'short' }}
        </ng-template>
      </column>
      <column name="updatedAt">
        <ng-template header> Güncellenme Tarihi </ng-template>
        <ng-template data let-item="item">
          {{ item.updatedAt | date : 'short' }}
        </ng-template>
      </column>

      <column name="actions">
        <ng-template header> Aksiyonlar </ng-template>
        <ng-template data let-item="item">
          <div class="action-buttons">
            <block-button
              (click)="removeExternalPlatform(item.id)"
              buttonClass="bg-danger"
              iconClass="material-symbols-outlined"
              iconContent="delete"
              >Sil</block-button
            >
            <block-button
              (click)="editExternalPlatform(item)"
              buttonClass="primary"
              iconClass="material-symbols-outlined"
              iconContent="edit"
              >Düzenle</block-button
            >
          </div>
        </ng-template>
      </column>
    </searchable-data-table>
  </ng-container>
</lotus-web-data-list-layout>
