<lotus-web-data-list-layout>
  <ng-template action>
    <block-button buttonClass="primary" style="margin-bottom: 10px" (click)="createAddress()"
      stringContent="postral.address.create-new" iconClass="material-symbols-outlined" iconContent="add">
    </block-button>
  </ng-template>
  <ng-container content>
    <searchable-data-table url="/service/payment/api/address/_search" [cover]="true" [otherFilter]="{ admin: admin() }" #table>
      <column name="id">
        <ng-template header content="general.id"></ng-template>
        <ng-template data let-item="item">
          {{ item.id }}
        </ng-template>
      </column>
      <column name="name">
        <ng-template header content="postral.address.name"></ng-template>
        <ng-template data let-item="item">
          {{ item.name }}
        </ng-template>
      </column>

      <column name="actions">
        <ng-template header content="general.actions"></ng-template>
        <ng-template data let-item="item">
          <div class="action-buttons">
            <block-button [routerLink]="['../address', item.id]" iconClass="material-symbols-outlined"
              iconContent="info" stringContent="postral.address.info" [hasContent]="false"></block-button>
            <block-button (click)="deleteAddress(item.id)" buttonClass="bg-danger" iconClass="material-symbols-outlined"
              iconContent="close" stringContent="postral.address.delete" [hasContent]="false"></block-button>
          </div>
        </ng-template>
      </column>
    </searchable-data-table>
  </ng-container>
</lotus-web-data-list-layout>
