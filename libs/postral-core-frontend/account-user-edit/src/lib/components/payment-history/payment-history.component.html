<lotus-web-data-list-layout>
  <ng-template action>
    <lotus-web-searchable-data-table-filter-config-holder [searchableDataTableComponent]="dataTable">

    </lotus-web-searchable-data-table-filter-config-holder>
  </ng-template>
  <ng-container content>
    <searchable-data-table
      url="/service/payment/api/payment/_search"
      [otherFilter]="{ searchSide: historySearchSide() }"
      [cover]="true"
      [reformFilter]="reform()"
      #dataTable
    >
      <!-- <column name="id">
        <ng-template header content="general.id"></ng-template>
        <ng-template data let-item="item">
          {{ item.id }}
        </ng-template>
      </column> -->
      <column name="paymentDate">
        <ng-template header content="postral.payment.date"></ng-template>
        <ng-template data let-item="item">
          {{ item.createdAt | date : 'short' }}
        </ng-template>
      </column>
      <column name="type">
        <ng-template header content="postral.payment.type"></ng-template>
        <ng-template data let-item="item">
          {{ (item.type === 'PURCHASE' ? 'postral.payment.type-purchase' : 'postral.payment.type-refund') | translate }}
        </ng-template>
      </column>
      <column name="amount">
        <ng-template header content="postral.amount"></ng-template>
        <ng-template data let-item="item">
          <lib-money-display
            [amount]="item.totalAmount"
            [currency]="item.currency"
          ></lib-money-display>
        </ng-template>
      </column>
      <column name="status">
        <ng-template header content="general.status"></ng-template>
        <ng-template data let-item="item">
          <!-- {{ item.paymentStatus }} <br />
          {{ item.errorStatus }} -->
          <lotus-web-status-badge
            [color]="
              item.paymentStatus == 'COMPLETED'
                ? 'green'
                : (item.paymentStatus == 'WAITING' || item.paymentStatus == 'INITIATED')
                ? 'gray'
                : 'gray'
            "
            [label]="
              (item.paymentStatus == 'COMPLETED'
                ? 'postral.payment.status-completed'
                : (item.paymentStatus == 'WAITING' || item.paymentStatus == 'INITIATED')
                ? 'postral.payment.status-waiting'
                : 'postral.payment.status-failed') | translate
            "
          ></lotus-web-status-badge>
        </ng-template>
      </column>
      <column name="customerId">
        <ng-template header content="postral.customer"></ng-template>
        <ng-template data let-item="item">
          {{ item.customerAccountName || item.customerId }}
        </ng-template>
      </column>
      <column name="actions">
        <ng-template header content="general.actions"></ng-template>
        <ng-template data let-item="item">
          <block-button
            buttonClass="secondary"
            (click)="goPaymentInfo(item.id)"
            stringContent="general.detail"
            iconClass="material-symbols-outlined" iconContent="visibility"
          >
          </block-button>
        </ng-template>
      </column>
    </searchable-data-table>
  </ng-container>
</lotus-web-data-list-layout>
