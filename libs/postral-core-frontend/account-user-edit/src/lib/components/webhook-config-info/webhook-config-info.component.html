<div class="flex flex-column h-full w-full">
  @if (createdEventKey()) {
  <div class="mona-card" severity="warn">
    <p>
      {{ 'postral.webhook.event-key-warning' | translate }}
    </p>
    <div class="bg-1 bg-1-text monospace p-2 mb-2">
      {{ createdEventKey() }}
    </div>
    @if (programmaticCopyEnabled()) {

    <block-button
      buttonClass="border"
      (click)="copyEventKey()"
      [disabled]="isCopyDisabled()"
      stringContent="admin.account-user-edit.webhook-config-info.copy"
      iconClass="material-symbols-outlined"
      iconContent="content_copy"
    ></block-button>
    } @else {
    <sub class="text-muted">
      {{ 'general.copy.warn.support' | translate }}
    </sub>
    }
  </div>
  } @if (instruction()) {
  <div class="flex-grow-1">
    <lib-reform-data-edit
      [formInstruction]="instruction()!"
    ></lib-reform-data-edit>
  </div>
  } @else {
  <p>{{ 'general.loading' | translate }}</p>
  }
</div>
