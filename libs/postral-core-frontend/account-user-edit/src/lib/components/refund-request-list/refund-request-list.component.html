<lotus-web-data-list-layout>
  <ng-container content>
    <searchable-data-table
      url="/service/payment/api/refund/request/_search"
      [cover]="true"
      [otherFilter]="{ admin: admin() }"
      #table
    >
      <column name="id">
        <ng-template header content="general.id"> Id </ng-template>
        <ng-template data let-item="item">
          {{ item.id }}
        </ng-template>
      </column>
      <column name="paymentId">
        <ng-template header content="postral.invoice.payment-id"> Ödeme id </ng-template>
        <ng-template data let-item="item">
          {{ item.paymentId }}
        </ng-template>
      </column>
      <column name="status">
        <ng-template header content="general.status"> Durum </ng-template>
        <ng-template data let-item="item">
          {{ item.status }}
        </ng-template>
      </column>
      <column name="createdAt">
        <ng-template header content="general.creation-date"> </ng-template>
        <ng-template data let-item="item">
          {{ item.createdAt | date : 'short' }}
        </ng-template>
      </column>
      <column name="updatedAt">
        <ng-template header content="general.update-date"> </ng-template>
        <ng-template data let-item="item">
          {{ item.updatedAt | date : 'short' }}
        </ng-template>
      </column>
      <column name="actions">
        <ng-template header content="general.actions"></ng-template>
        <ng-template data let-item="item">
          <div class="action-buttons">
            <!-- <block-button
              [routerLink]="['../address', item.id]"
              iconClass="material-symbols-outlined"
              iconContent="info"
              >Adres bilgileri</block-button
            > -->

            <block-button
              [routerLink]="['../', item.id]"
              buttonClass="primary"
              iconClass="material-symbols-outlined"
              iconContent="info"
              stringContent="general.details"
            ></block-button>
            <block-button
              (click)="deleteRefund(item.id, 'rejected')"
              buttonClass="bg-danger"
              iconClass="material-symbols-outlined"
              iconContent="close"
              stringContent="general.reject"
              [hasContent]="false"
            ></block-button>
          </div>
        </ng-template>
      </column>
    </searchable-data-table>
  </ng-container>
</lotus-web-data-list-layout>
