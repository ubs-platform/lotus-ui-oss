<div class="h-full w-full" style="display: block">
  <lib-tab-view>
    <ng-template block-page="information" title="postral.item.info">
      @if (instruction()) {
      <div class="flex flex-column">
        <div class="flex-grow-1 overflow-auto">
          <lib-reform-data-edit
            [formInstruction]="instruction()!"
            saveButtonPosition="bottom"
          ></lib-reform-data-edit>
        </div>
        @if (unitDescription()) {
        <div>{{ 'postral.item.info-label' | translate }}: {{ unitDescription() | translate }}</div>
        }
      </div>
      } @else {
      <p>{{ 'postral.item.no-form-instruction' | translate }}</p>
      }
    </ng-template>
    <ng-template block-page="pricing" title="postral.item.price-list">
      @if (itemId()) {
      <lib-item-price-list [itemId]="itemId()"></lib-item-price-list>
      }
    </ng-template>
  </lib-tab-view>
</div>
